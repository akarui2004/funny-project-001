[env]
port = 3000

[datasource]
  [datasource.master]
    dialect = "postgres"
    host = "localhost"
    port = 5432
    schema = "public"
    username = ""
    password = ""
    [datasource.master.pool]
      max = 10
      min = 0
      acquireTimeout = 30000
      idle = 10000
    [datasource.master.option]
      ssl = false
      connectionTimeout = 60000

[redis]
  [redis.master]
    host = "localhost"
    port = 6379
    keyPrefix = "app:"
    db = 0
    [redis.master.option]
      connectionTimeout = 60000
      keepAlive = 30000
      maxRetriesPerRequest = 5
  [redis.queue]
    host = "localhost"
    port = 6379
    keyPrefix = "queue:"
    db = 1
    [redis.queue.option]
      connectionTimeout = 60000
      keepAlive = 30000
      maxRetriesPerRequest = 5

[logger]
  level = 'info'
  [logger.rotating]
    dirname = 'logs'
    prefixFileName = 'app'
    datePattern = 'YYYY-MM-DD'
    maxSize = '100m'
    maxFiles = '30d'